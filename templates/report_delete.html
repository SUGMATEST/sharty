<div id="post-moderation-fields">
	{% if config.allow_delete %}
	<div id="delete-fields">
		{% trans %}Delete Post{% endtrans %} [<input title="Delete file only" type="checkbox" name="file" id="delete_file" />
		 <label for="delete_file">{% trans %}File{% endtrans %}</label>] <label for="password">{% trans %}Password{% endtrans %}</label> 
		<input id="password" type="password" name="password" size="12" maxlength="18" />
		<input type="submit" name="delete" value="{% trans %}Delete{% endtrans %}" />
	</div>
	{% endif %}
	
	<div id="report-fields">
		<label for="reason">{% trans %}Reason{% endtrans %}</label> 
		<!--
			_('1. You WILL NOT post, link to, or request illegal content.'),
			_('1a. Attempting to get the site taken down via DDOS, false reports, etc. is FORBIDDEN.'),
			_('2. You WILL NOT advocate, promote, or post pedophilia or pedophilic content.'),
			_('2a. The posting of "soylita", "shoyta" and its derivatives is not permitted.'),
			_('3. You WILL NOT advertise for imageboards, discord servers, telegram channels, crypto projects, etc.'),
			_('3a. Participation in hostile or disruptive off-site communities or servers is FORBIDDEN.'),
			_('4. You WILL NOT excessively spam threads or boards via means of botting.'),
			_('4a. Sending false reports is FORBIDDEN.'),
			_('4b. Certain types of manual spam may still be punishable. See "Grey Areas"'),
			_('5. You WILL adhere to the general topic or theme of the board you are posting on. Posts that do not pertain to the topic or theme of the board WILL be moved or removed.'),
			_('6. You WILL NOT post in an identifiable manner on the site. This includes avatarfagging and namefagging.'),
			_('7. Residential proxies or residential VPNs are forbidden.')

		-->
		{%if true%}
			<input id="reason" type="text" name="reason" size="20" maxlength="30" />
		{%else%}
		<select id="reason" name="reason">
			<option value="1. You WILL NOT post, link to, or request illegal content.">1. You WILL NOT post, link to, or request illegal content.</option>
			<option value="1a. Attempting to get the site taken down via DDOS, false reports, etc. is FORBIDDEN.">1a. Attempting to get the site taken down via DDOS, false reports, etc. is FORBIDDEN.</option>
			<option value="2. You WILL NOT advocate, promote, or post pedophilia or pedophilic content.">2. You WILL NOT advocate, promote, or post pedophilia or pedophilic content.</option>
			<option value="2a. The posting of 'soylita', 'shoyta' and its derivatives is not permitted.">2a. The posting of 'soylita', 'shoyta' and its derivatives is not permitted.</option>
			<option value="3. You WILL NOT advertise for imageboards, discord servers, telegram channels, crypto projects, etc.">3. You WILL NOT advertise for imageboards, discord servers, telegram channels, crypto projects, etc.</option>
			<option value="3a. Participation in hostile or disruptive off-site communities or servers is FORBIDDEN.">3a. Participation in hostile or disruptive off-site communities or servers is FORBIDDEN.</option>
			<option value="4. You WILL NOT excessively spam threads or boards via means of botting.">4. You WILL NOT excessively spam threads or boards via means of botting.</option>
			<option value="4a. Sending false reports is FORBIDDEN.">4a. Sending false reports is FORBIDDEN.</option>
			<option value="4b. Certain types of manual spam may still be punishable. See 'Grey Areas'">4b. Certain types of manual spam may still be punishable. See 'Grey Areas'</option>
			<option value="5. You WILL adhere to the general topic or theme of the board you are posting on. Posts that do not pertain to the topic or theme of the board WILL be moved or removed.">5. You WILL adhere to the general topic or theme of the board you are posting on. Posts that do not pertain to the topic or theme of the board WILL be moved or removed.</option>
			<option value="6. You WILL NOT post in an identifiable manner on the site. This includes avatarfagging and namefagging.">6. You WILL NOT post in an identifiable manner on the site. This includes avatarfagging and namefagging.</option>
			<option value="7. Residential proxies or residential VPNs are forbidden.">7. Residential proxies or residential VPNs are forbidden.</option>
                        <option value="7. Calling Jiren weak is forbidden.">7. Calling Jiren weak is forbidden.</option>
			<option value="Hurt my feelings">Hurt my feelings</option>
		</select>
		{%endif%}

		<label for="urgent-checkbox"> Urgent report</label>
		<input type="checkbox" name="urgent" value="true" id="urgent-checkbox" />

		<input type="submit" name="report" value="{% trans %}Report{% endtrans %}" />
	</div>
</div>

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Enable real IP module to trust the proxy
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Handle React Router navigation
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy rules replicated from Vite config
    location ~ ^/(?:[a-zA-Z0-9_-]+/(?:catalog\.json$|thread/.*\.json$|res/.*\.json$|thumb/.*|src/.*)|js/integrity/20/integrity.*|.*\.php|static/.*) {
        proxy_pass https://backend.soyjak.st;
        proxy_set_header Host backend.soyjak.st;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }
}
